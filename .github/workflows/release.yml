name: publish

on:
  # 手动触发，便于在本地验证通过后再发布
  workflow_dispatch:
  # 推送以 v 开头的标签时自动构建并创建 Release，例如 v0.1.0
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate curated release notes (bilingual)
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
              echo "Manual publish requires selecting a v* tag ref (got: ${GITHUB_REF})" >&2
              exit 1
            fi
          fi

          file="releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$file" ]; then
            echo "Missing release notes file: $file" >&2
            echo "Create it (and rewrite it) before tagging, e.g.:" >&2
            echo "  node scripts/generate-release-notes.mjs \"${GITHUB_REF_NAME}\" \"<previousTag>\" > \"$file\"" >&2
            exit 1
          fi

          if ! grep -qE '^##[[:space:]]+English([[:space:]]|$)' "$file"; then
            echo "Release notes must include a '## English' section: $file" >&2
            exit 1
          fi

          if ! grep -qE '^##[[:space:]]+中文([[:space:]]|$)' "$file"; then
            echo "Release notes must include a '## 中文' section: $file" >&2
            exit 1
          fi

      - name: Create or update draft release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          file="releases/${tag}.md"
          target="$(git rev-parse "${tag}^{commit}")"
          title="FFUI ${tag}"

          # 草稿 release 按 tag 解析在跨 run / 手动 dispatch 时会 not found，
          # 因此统一从 releases 列表（含草稿）按 tag_name 解析出 id 与 draft 状态。
          meta="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\") | (.id|tostring) + \" \" + (.draft|tostring)" | head -n 1)"
          if [ -n "$meta" ]; then
            release_id="$(echo "$meta" | cut -d ' ' -f 1)"
            is_draft="$(echo "$meta" | cut -d ' ' -f 2)"
            if [ "$is_draft" != "true" ]; then
              echo "release ${tag} 已经是正式发布，拒绝把它打回草稿；请提升版本后打新 tag。" >&2
              exit 1
            fi
            # 按 id 更新草稿：既避开草稿的 tag 解析问题，也避免把正式发布改回草稿。
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f tag_name="$tag" \
              -f target_commitish="$target" \
              -f name="$title" \
              -F draft=true \
              -F body=@"$file" >/dev/null
          else
            # 用 REST 直接创建并取回 id：gh release create 之后的列表查询可能与创建存在可见性延迟
            #（v0.3.5 首次运行就是这样卡在解析上），而 POST 的响应体直接带 id。
            release_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$target" \
              -f name="$title" \
              -F draft=true \
              -F body=@"$file" \
              --jq '.id')"
          fi

          if [ -z "${release_id}" ]; then
            echo "无法解析 release id（tag=${tag}）" >&2
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            zsync \
            ffmpeg

      - name: Install FFmpeg (macOS only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows only)
        if: startsWith(matrix.platform, 'windows-')
        run: choco install ffmpeg -y --no-progress

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 仅缓存 Tauri 后端的 target 目录
          workspaces: "./src-tauri -> target"

      - name: Cache Tauri tooling downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-v1
          restore-keys: |
            tauri-tools-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and tag
        shell: bash
        run: |
          tauri_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          npm_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          # Rust 侧也必须是同一个版本：tag、装配版本与 crate 版本漂移会让产物的自述版本对不上。
          cargo_version="$(node -e "const fs = require('node:fs'); const m = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = \"([^\"]+)\"/m); console.log(m ? m[1] : '')")"
          lock_version="$(node -e "const fs = require('node:fs'); const rest = fs.readFileSync('src-tauri/Cargo.lock', 'utf8').split('name = \"ffui\"')[1] || ''; const m = rest.match(/version = \"([^\"]+)\"/); console.log(m ? m[1] : '')")"

          if [ "$cargo_version" != "$tauri_version" ] || [ "$lock_version" != "$tauri_version" ] ; then
            echo "Cargo version mismatch: Cargo.toml=$cargo_version, Cargo.lock=$lock_version, tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
              echo "Manual publish requires selecting a v* tag ref (got: ${GITHUB_REF})" >&2
              exit 1
            fi
          fi

          if [ -z "$tauri_version" ] || [ -z "$npm_version" ]; then
            echo "Failed to read versions from src-tauri/tauri.conf.json and/or package.json" >&2
            exit 1
          fi

          if [ "$tauri_version" != "$npm_version" ]; then
            echo "Version mismatch: src-tauri/tauri.conf.json=$tauri_version, package.json=$npm_version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="v${tauri_version}"
            if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
              echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, expected=${expected}" >&2
              exit 1
            fi
          fi

      - name: Validate Cargo binary targets
        shell: bash
        run: |
          node -e "const { execSync } = require('node:child_process'); const json = JSON.parse(execSync('cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1', { encoding: 'utf8' })); const pkg = json.packages.find(p => p.name === 'ffui'); if (!pkg) { console.error('Failed to locate ffui package in cargo metadata'); process.exit(1); } const bins = pkg.targets.filter(t => Array.isArray(t.kind) && t.kind.includes('bin')).map(t => t.name); if (bins.length !== 1 || bins[0] !== 'ffui') { console.error('Unexpected Cargo bin targets (will be bundled on Linux packages): ' + (bins.join(', ') || '<none>')); process.exit(1); }"

      - name: Validate no extra Rust bins under src-tauri/src/bin
        shell: bash
        run: |
          if [ -d "src-tauri/src/bin" ] && find "src-tauri/src/bin" -maxdepth 1 -type f -name '*.rs' | grep -q .; then
            echo "Unexpected Rust bin sources under src-tauri/src/bin; move them out to avoid Tauri bundling side effects." >&2
            find "src-tauri/src/bin" -maxdepth 1 -type f -name '*.rs' -print >&2
            exit 1
          fi

      - name: Validate updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Missing secret: TAURI_SIGNING_PRIVATE_KEY (required for updater signatures)." >&2
            echo "Generate it with: pnpm tauri -- signer generate -w ~/.tauri/ffui-updater.key --ci" >&2
            echo "Then set the GitHub Actions secret to the private key content or path." >&2
            exit 1
          fi

          pubkey="$(node -e "const fs=require('node:fs'); const cfg=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); console.log(cfg?.plugins?.updater?.pubkey ?? '')")"
          if [ -z "${pubkey}" ] || [ "${pubkey}" = "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo "Updater pubkey is not configured in src-tauri/tauri.conf.json." >&2
            echo "Set plugins.updater.pubkey to the public key string generated by 'tauri signer generate'." >&2
            exit 1
          fi

      - name: Build and release with Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # GitHub 默认提供的 token，用于创建 Release 与上传构建产物
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for updater signatures (do not commit private keys).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # 就地填入 AppImage 的更新信息（见 scripts/embed-appimage-update-info.sh）、重签、并同步 latest.json。
      # Tauri 打包器把 runtime 的 .upd_info 段留空，AppImageUpdate 等工具因此拒绝就地更新，目录站也会提示；
      # 而就地改写发生在 tauri-action 签名之后，所以 .sig 与 latest.json 里的 signature 必须一起重建，
      # 否则应用内更新会在 minisign 校验处静默失败。上传必须在门禁之前——门禁会核对三者相互一致。
      - name: Embed AppImage update information and refresh its signatures
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          image="$(node -e 'const a = JSON.parse(process.env.ARTIFACT_PATHS || "[]"); const m = a.filter((p) => p.endsWith(".AppImage")); if (m.length !== 1) { console.error("expected exactly one AppImage in artifactPaths, found " + m.length); process.exit(1); } process.stdout.write(m[0]);')"
          bash scripts/embed-appimage-update-info.sh "$image"
          rm -f "$image.sig"
          pnpm exec tauri signer sign "$image"
          mkdir -p dist-updater
          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --dir dist-updater --clobber
          node scripts/refresh-appimage-signature-in-latest-json.mjs dist-updater/latest.json "$image" "$image.sig"
          gh release upload "$TAG" "$image" "$image.sig" "$image.zsync" dist-updater/latest.json --clobber --repo "$REPO"

      - name: Prepare Windows portable exe asset
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-portable
          src="src-tauri/target/release/ffui.exe"
          if [ ! -f "$src" ]; then
            echo "Portable exe not found: $src" >&2
            exit 1
          fi
          out="dist-portable/FFUI-v${{ steps.tauri.outputs.appVersion }}-windows-x64-portable.exe"
          cp "$src" "$out"
          ls -la dist-portable

      - name: Upload Windows portable exe to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.tauri.outputs.appVersion }}
          files: dist-portable/FFUI-v${{ steps.tauri.outputs.appVersion }}-windows-x64-portable.exe
          fail_on_unmatched_files: true
          # 保持草稿：正式发布由 publish-release 在全流程门禁通过后执行
          draft: true

  # 全流程门禁：对**已上传到草稿 release 的 AppImage** 跑与 AppImageHub 同款的验收
  # （结构 + 权限面 + 非属主启动 + 该站正在跑的 worker.sh）。任一步失败都不会发布。
  verify-appimage:
    name: verify-appimage
    needs: publish-tauri
    # 需要 write 才能看到草稿 release：草稿只对有 push 权限者可见，
    # contents: read 时 gh release download 会对草稿返回 not found（门禁第一步即失败）。
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # squashfs-tools 提供 unsquashfs：权限面与非属主启动都读镜像内存储模式，
      # 不能用 runtime 的 --appimage-extract（它把所有目录建成 0700）。
      - name: Install harness dependencies
        run: |
          sudo apt-get update
          # GL/EGL 与目录站 workflow 的图形栈保持一致：AppImage 不自带 libEGL/libGL，
          # 缺了它们应用会以『error while loading shared libraries: libEGL.so.1』直接退出，
          # 门禁就会把一个本来能在目录站跑起来的产物判成失败。
          sudo apt-get install -y \
            squashfs-tools xvfb icewm x11-utils imagemagick xdotool \
            desktop-file-utils libfile-mimeinfo-perl libfuse2 firejail \
            libegl1 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri libosmesa6 mesa-utils \
            xmlstarlet xsel xterm x11-apps netpbm stalonetray fonts-wqy-microhei \
            libasound2-dev pulseaudio-utils alsa-utils alsa-oss libjack0 libsdl1.2-dev libsdl2-2.0-0 \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim \
            tesseract-ocr-ara tesseract-ocr-rus tesseract-ocr-ell
          # harness 的导出阶段用得到这两个（与目录站 test.yml 相同）：
          # 缺 dupervisor 时 worker.sh 会在最后一步以 `dv: command not found` 非零退出。
          sudo gem install dupervisor -v 1.0.5
          sudo npm install -g asar
          # 目录站在跑 harness 前会在同一个 Xvfb 上隐去任务栏，使截图只含应用窗口。
          mkdir -p "$HOME/.icewm"
          cat > "$HOME/.icewm/preferences" <<'EOF'
          ShowTaskBar = 0
          TaskBarAutoHide = 1
          TaskBarShowWorkspaces = 0
          TaskBarShowAllWindows = 0
          TaskBarShowClock = 0
          TaskBarShowMailboxStatus = 0
          TaskBarShowCPUStatus = 0
          TaskBarShowWindowListMenu = 0
          EOF

      - name: Download the uploaded AppImage from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.AppImage' \
            --pattern '*.AppImage.sig' \
            --pattern '*.AppImage.zsync' \
            --pattern 'latest.json' \
            --dir dist
          # 只接受恰好一个 AppImage：脚本只判 $1，多个产物时静默只测第一个是假通过。
          count="$(find dist -maxdepth 1 -name '*.AppImage' | wc -l)"
          if [ "$count" -ne 1 ] ; then
            echo "expected exactly one AppImage in the draft release, found $count" >&2
            exit 1
          fi
          # 配套的 .zsync 是增量更新所需；缺了说明 embed 步骤没跑或没上传成功。
          zsync_count="$(find dist -maxdepth 1 -name '*.AppImage.zsync' | wc -l)"
          if [ "$zsync_count" -ne 1 ] ; then
            echo "expected exactly one AppImage.zsync in the draft release, found $zsync_count" >&2
            exit 1
          fi
          # 更新签名与更新清单同样必须存在：改写后不重签会让应用内更新静默失效。
          sig_count="$(find dist -maxdepth 1 -name '*.AppImage.sig' | wc -l)"
          if [ "$sig_count" -ne 1 ] ; then
            echo "expected exactly one AppImage.sig in the draft release, found $sig_count" >&2
            exit 1
          fi
          if [ ! -f dist/latest.json ] ; then
            echo "latest.json is missing from the draft release" >&2
            exit 1
          fi
          ls -la dist

      - name: Full-flow acceptance gate
        env:
          RUN_HARNESS: "1"
          REQUIRE_HARNESS: "1"
          WORKER_TIMEOUT: "600"
          # 钉到具体提交：本作业持有 contents: write，不应让上游 master 的变化决定它能执行什么；
          # 需要跟随目录站新版时显式更新此 sha（改完照例走 review + 门禁）。
          HARNESS_COMMIT: "1cdda47df1df14ac48a25f886154aea8cac49cce"
          # 同理由：阶段 1 的 appdir-lint.sh/excludelist 也钉住。
          APPIMAGES_COMMIT: "19e30b276ffedf4d3b4b56bc6320f463625a74f8"
          # 目录站里的条目名（data/<条目名>）与命名严格度：条目由 PR 新增时，目录站按 STRICT=true 校验。
          APP_NAME: "FFUI"
          APP_STRICT: "true"
          # 失败时把 worker.log/app.log/截图复制到这里，再由下面的步骤上传成 artifact：
          # runner 一结束 /tmp 就没了，没有它就只能靠猜。
          KEEP_DIR: gate-artifacts
        run: |
          set -euo pipefail
          bash scripts/verify-appimage.sh dist/*.AppImage

      - name: Upload gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-gate-diagnostics
          path: gate-artifacts/
          if-no-files-found: ignore

  # 发布 SHA256SUMS：未签名二进制至少要能核验来源（也回应 issue #1 的误报质疑）。
  publish-checksums:
    name: publish-checksums
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA256SUMS for the draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir assets --clobber
          # 只覆盖随发布提供的安装包与更新清单（.sig/.zsync 是派生文件，不列入）。
          ( cd assets && find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.zsync' ! -name 'SHA256SUMS' -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum ) > SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"

  # 门禁通过、校验和就绪后才把草稿转为正式发布（AppImageHub 只认非草稿、非预发布的 release）
  publish-release:
    name: publish-release
    needs: [verify-appimage, publish-checksums]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
